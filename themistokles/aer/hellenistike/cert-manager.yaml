---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 4h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: themistokles
  path: themistokles/ge/base/cert-manager
  patches:
    - target:
        kind: HelmRelease
        name: cert-manager
      patch: |
        - op: replace
          path: /spec/chart/spec/version
          value: v1.21.2
        - op: replace
          path: /spec/values
          value:
            crds:
              enabled: true
  prune: true
  wait: true
