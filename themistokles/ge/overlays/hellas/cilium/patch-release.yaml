apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  values:
    cluster:
      name: hellas-odysseia
    operator:
      replicas: 2
      rollOutPods: true
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
    rollOutCiliumPods: true
    envoy:
      rollOutPods: true
    hubble:
      enabled: true
      relay:
        enabled: true
        replicas: 2
        rollOutPods: true
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                k8s-app: hubble-relay
      ui:
        enabled: true
        rollOutPods: true
      tls:
        enabled: true
        auto:
          enabled: true
          method: helm
          certValidityDuration: 365
