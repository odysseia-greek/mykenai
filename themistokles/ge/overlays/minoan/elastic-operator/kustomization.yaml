apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aristoteles-operator
resources:
  - ../../../base/elastic-operator
patches:
  - target:
      kind: Namespace
      name: elastic-operator
    patch: |-
      - op: replace
        path: /metadata/name
        value: aristoteles-operator
  - target:
      kind: HelmRelease
      name: elastic-operator
    patch: |-
      - op: add
        path: /spec/values
        value:
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
