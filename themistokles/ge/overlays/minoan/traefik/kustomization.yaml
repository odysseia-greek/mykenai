apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik
resources:
  - ../../../base/traefik

patches:
  - target:
      kind: IngressRoute
      name: dashboard
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`traefik.minoan.odysseia-greek`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: traefik
    path: patch-release.yaml
