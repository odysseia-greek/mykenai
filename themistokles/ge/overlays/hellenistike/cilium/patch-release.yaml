apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  releaseName: cilium
  values:
    cluster:
      name: hellenistike-odysseia
    rollOutCiliumPods: true
    k8sServiceHost: 192.168.1.131
    k8sServicePort: 6443
    hubble:
      enabled: true
      relay:
        enabled: true
        rollOutPods: true
      ui:
        enabled: true
        rollOutPods: true
      tls:
        enabled: true
        auto:
          enabled: true
          method: helm
          certValidityDuration: 365
    envoy:
      enabled: false
    # Disabling the DaemonSet alone still permits embedded Envoy in the agent.
    l7Proxy: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    operator:
      rollOutPods: true
      nodeSelector:
        kubernetes.io/hostname: pella-hellenistike
      replicas: 1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
