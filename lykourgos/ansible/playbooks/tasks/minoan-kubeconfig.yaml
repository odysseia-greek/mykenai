---
- name: Read generated Minoan credentials
  ansible.builtin.slurp:
    src: '{{ playbook_dir }}/k0s-kubeconfig-minoan'
  register: minoan_credentials
  no_log: true

- name: Decode generated configuration
  ansible.builtin.set_fact:
    minoan_source_config: '{{ minoan_credentials.content | b64decode | from_yaml }}'
    minoan_config_path: "{{ minoan_kubeconfig_path | default(lookup('env', 'HOME') ~ '/.kube/config') }}"
  no_log: true

- name: Validate single-cluster credentials
  ansible.builtin.assert:
    that:
      - minoan_source_config.clusters | length == 1
      - minoan_source_config.users | length == 1
      - minoan_source_config.contexts | length == 1
  no_log: true

- name: Inspect user's existing kubeconfig
  ansible.builtin.stat:
    path: '{{ minoan_config_path }}'
  register: minoan_existing_kubeconfig

- name: Read user's existing kubeconfig
  ansible.builtin.slurp:
    src: '{{ minoan_config_path }}'
  register: minoan_existing_credentials
  when: minoan_existing_kubeconfig.stat.exists
  no_log: true

- name: Decode existing configuration
  ansible.builtin.set_fact:
    minoan_target_config: >-
      {{ (minoan_existing_credentials.content | b64decode | from_yaml | default({}, true))
         if minoan_existing_kubeconfig.stat.exists else {} }}
  no_log: true

- name: Merge named entries and preserve the active context
  ansible.builtin.set_fact:
    minoan_merged_config: >-
      {{ minoan_target_config | combine({
          'apiVersion': 'v1',
          'kind': 'Config',
          'clusters': (minoan_target_config.clusters | default([]) | rejectattr('name', 'equalto', 'minoan-odysseia') | list)
            + [minoan_source_config.clusters[0] | combine({'name': 'minoan-odysseia'})],
          'users': (minoan_target_config.users | default([]) | rejectattr('name', 'equalto', 'minoan-odysseia-admin') | list)
            + [minoan_source_config.users[0] | combine({'name': 'minoan-odysseia-admin'})],
          'contexts': (minoan_target_config.contexts | default([]) | rejectattr('name', 'equalto', 'minoan-odysseia') | list)
            + [minoan_source_config.contexts[0] | combine({
                'name': 'minoan-odysseia',
                'context': minoan_source_config.contexts[0].context | combine({
                  'cluster': 'minoan-odysseia', 'user': 'minoan-odysseia-admin'})})],
          'current-context': minoan_target_config['current-context'] | default('minoan-odysseia', true)
        }) }}
  no_log: true

- name: Ensure kubeconfig directory exists
  ansible.builtin.file:
    path: '{{ minoan_config_path | dirname }}'
    state: directory
    mode: '0700'

- name: Save merged kubeconfig with a backup and private permissions
  ansible.builtin.copy:
    content: '{{ minoan_merged_config | to_nice_yaml(indent=2) }}'
    dest: '{{ minoan_config_path }}'
    mode: '0600'
    backup: true
  when: minoan_merged_config != minoan_target_config
  no_log: true
