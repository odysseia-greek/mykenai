apiVersion: apps/v1
kind: Deployment
metadata:
  name: dionysios
  labels:
    app: dionysios
  annotations:
    volumes.odysseia.io/secrets: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dionysios
  template:
    metadata:
      labels:
        app: dionysios
        release: dionysios
        version: v0.2.4
      annotations:
        odysseia-greek/role: api
        odysseia-greek/access: grammar
        perikles/accesses: "solon;eratosthenes;aristarchos;kallimachos"
    spec:
      containers:
        - name: dionysios
          image: ghcr.io/odysseia-greek/dionysios:v0.2.4
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ELASTIC_ACCESS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['odysseia-greek/access']
          envFrom:
            - configMapRef:
                name: dionysios
          volumeMounts: []
          ports:
            - name: http
              containerPort: 5000
            - name: grpc
              containerPort: 50060
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 20
      volumes: []
