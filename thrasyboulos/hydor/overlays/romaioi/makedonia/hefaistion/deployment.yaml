apiVersion: apps/v1
kind: Deployment
metadata:
  name: hefaistion
  labels:
    app: hefaistion
  annotations:
    volumes.odysseia.io/secrets: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hefaistion
  template:
    metadata:
      labels:
        app: hefaistion
        release: hefaistion
      annotations:
        odysseia-greek/role: api
        odysseia-greek/access: dictionary
        perikles/accesses: "solon"
    spec:
      containers:
        - name: "hefaistion"
          image: ghcr.io/odysseia-greek/hefaistion
          imagePullPolicy: Always
          env:
            - name: ELASTIC_ACCESS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['odysseia-greek/access']
          envFrom: []
          ports:
            - containerPort: 50060
      volumes: []