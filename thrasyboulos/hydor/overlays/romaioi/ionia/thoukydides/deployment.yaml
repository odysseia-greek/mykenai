apiVersion: apps/v1
kind: Deployment
metadata:
  name: thoukydides
  labels:
    app: thoukydides
  annotations:
    volumes.odysseia.io/secrets: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thoukydides
  template:
    metadata:
      labels:
        app: thoukydides
        release: thoukydides
      annotations:
        odysseia-greek/role: api
        odysseia-greek/access: reading
        perikles/accesses: "solon"
    spec:
      initContainers:
        - name: hekataios
          image: ghcr.io/odysseia-greek/hekataios
          imagePullPolicy: Always
          env:
            - name: ELASTIC_ACCESS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['odysseia-greek/access']
          envFrom:
            - configMapRef:
                name: odysseia-common-env
          volumeMounts:
            - name: solon-certs
              mountPath: /app/config/solon
              readOnly: true
      containers:
        - name: thoukydides
          image: ghcr.io/odysseia-greek/thoukydides
          imagePullPolicy: Always
          env:
            - name: PORT
              value: ":50060"
            - name: ELASTIC_ACCESS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['odysseia-greek/access']
          envFrom: []
          volumeMounts: []
          ports:
            - containerPort: 50060
      volumes: []
