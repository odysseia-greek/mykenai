apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ionia
resources:
  - ir.yaml
  - ../../../../base/ionia/herodotos
components:
  - ../../../../../pyr/koinos/deployment/aristophanes
  - ../../../../../pyr/koinos/services/graphql
  - ../../../../../pyr/koinos/resources/local/mid
  - ../../../../../pyr/koinos/common-env/base/deploy
  - ../../../../../pyr/koinos/downwardapi/version/deploy
patches:
  - target:
      version: v1
      kind: Service
    patch: |-
      - op: replace
        path: /metadata/name
        value: herodotos
      - op: replace
        path: /spec/selector/app
        value: herodotos
