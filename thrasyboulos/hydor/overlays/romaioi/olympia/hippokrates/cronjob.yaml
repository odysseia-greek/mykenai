apiVersion: batch/v1
kind: CronJob
metadata:
  name: hippokrates
  labels:
    app: hippokrates
spec:
  schedule: "*/20 * * * *"
  jobTemplate:
    metadata:
      labels:
        app: hippokrates
        release: hippokrates
      annotations:
        perikles/accesses: "homeros"
    spec:
      template:
        metadata:
          labels:
            app: hippokrates
            release: hippokrates
        spec:
          restartPolicy: Never
          containers:
            - name: hippokrates
              image: ghcr.io/odysseia-greek/hippokrates
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: hippokrates
      backoffLimit: 3
