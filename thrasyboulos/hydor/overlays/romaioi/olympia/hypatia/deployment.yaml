apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypatia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypatia
  template:
    metadata:
      labels:
        app: hypatia
        release: hypatia
        version: v0.0.1
    spec:
      containers:
        - name: hypatia
          image: ghcr.io/odysseia-greek/hypatia:v0.0.1
          imagePullPolicy: Always
          env:
            - name: PORT
              value: ":50061"
            - name: HTTP_PORT
              value: ":8080"
          envFrom: []
          ports:
            - name: grpc
              containerPort: 50061
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 32Mi
